<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 2400">
  <style>.hl{animation:hl 55s steps(176) infinite}.md{animation:md 55s steps(176) infinite}.c1{animation:c1 55s steps(704) infinite}.c2{animation:c2 55s steps(704) infinite}.cf{animation:cf 55s steps(99) infinite}.md,.cf,.ka,.kb{opacity:0}.s1{animation:s1 8.7s steps(58) -3s infinite alternate}.s2{animation:s2 2.4s steps(16) infinite alternate}.tw{animation:tw 11.1s steps(74) -4s infinite alternate}.ka{animation:ka 29s linear 7.4s infinite}.ky{animation:ky 29s ease-in-out 7.4s infinite}.wa{animation:wa 29s ease-in-out 7.4s infinite}.kb{animation:kb 47s linear 22s infinite}.wb{animation:wb 47s ease-in-out 22s infinite}.q .wb{animation-delay:21.85s}@keyframes hl{0%,15%,47%,100%{opacity:1}31%{opacity:.5}}@keyframes md{0%,15%,47%,100%{opacity:0}31%{opacity:.3}}@keyframes cf{0%,64%,100%{opacity:0}9%,55%{opacity:1}}@keyframes c1{0%{transform:translate(640px)}64%,100%{transform:translate(-720px)}}@keyframes c2{0%{transform:translate(700px)}64%,100%{transform:translate(-800px)}}@keyframes s1{0%{transform:rotate(-.5deg)}33.3%{transform:rotate(.2deg)}66.7%{transform:rotate(1.7deg)}100%{transform:rotate(2.5deg)}}@keyframes s2{0%{transform:rotate(-2deg)}33.3%{transform:rotate(-1deg)}66.7%{transform:rotate(1deg)}100%{transform:rotate(2deg)}}@keyframes tw{0%{transform:scaleX(1)}33.3%{transform:scaleX(.92)}66.7%{transform:scaleX(.75)}100%{transform:scaleX(.66)}}@keyframes ka{0%{transform:translate(1080px);opacity:0}2.4%,12.6%{opacity:1}15.3%,100%{transform:translate(60px);opacity:0}}@keyframes ky{0%{transform:translateY(12px)}6%{transform:translateY(-8px)}15.3%,100%{transform:translateY(4px)}}@keyframes wa{0%,1.3%,2.6%,3.8%,5.1%,6.4%,8.8%,10.1%,11.3%,12.6%,13.9%,15.2%,100%{transform:rotate(12deg) scale(1)}.6%,1.8%,3.1%,4.4%,5.7%,9.4%,10.6%,11.9%,13.2%,14.5%{transform:rotate(-8deg) scale(1.05,-.8)}7.1%,8.3%{transform:rotate(9deg) scale(.95,.52)}}@keyframes kb{0%{transform:translate(40px);opacity:0}2%,9.5%{opacity:1}11.6%,100%{transform:translate(1100px);opacity:0}}@keyframes wb{0%,.9%,1.8%,2.7%,3.6%,4.5%,5.4%,6.3%,7.1%,8%,8.9%,9.8%,10.7%,11.6%,100%{transform:rotate(12deg) scale(1)}.4%,1.3%,2.2%,3.1%,4%,4.9%,5.8%,6.7%,7.6%,8.4%,9.3%,10.2%,11.1%{transform:rotate(-8deg) scale(1.05,-.8)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <defs>
    <!-- 月晕：光从上方来，下半边几乎不发光，给正文让出暗底 -->
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="570" cy="262" r="430">
      <stop offset="0" stop-color="#c2432f" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#b13a2d" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#8a2a27" stop-opacity=".15"/>
      <stop offset=".64" stop-color="#5e1b1f" stop-opacity=".06"/>
      <stop offset=".82" stop-color="#3a1016" stop-opacity=".02"/>
      <stop offset="1" stop-color="#3a1016" stop-opacity="0"/>
    </radialGradient>
    <!-- 血月：上沿受光，往下被地影吞掉；明暗交界压在月亮中线以上 -->
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2654a"/>
      <stop offset=".16" stop-color="#cb4f37"/>
      <stop offset=".29" stop-color="#a53a2e"/>
      <stop offset=".37" stop-color="#762523"/>
      <stop offset=".44" stop-color="#47151a"/>
      <stop offset=".58" stop-color="#2f0d12"/>
      <stop offset="1" stop-color="#220a0e"/>
    </linearGradient>
    <linearGradient id="rim" x1=".85" y1="0" x2=".35" y2=".7">
      <stop offset="0" stop-color="#ffb08a" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#f08460" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#f08460" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mare" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3a0d10" stop-opacity=".4"/>
      <stop offset="1" stop-color="#3a0d10" stop-opacity="0"/>
    </radialGradient>
    <!-- 塔身：左侧面迎着月光略亮，右侧面沉下去 -->
    <linearGradient id="stone" gradientUnits="userSpaceOnUse" x1="530" y1="0" x2="670" y2="0">
      <stop offset="0" stop-color="#1a0e11"/>
      <stop offset=".5" stop-color="#0f090b"/>
      <stop offset=".52" stop-color="#0a0608"/>
      <stop offset="1" stop-color="#070405"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d08a"/>
      <stop offset="1" stop-color="#c99a52"/>
    </linearGradient>
    <linearGradient id="cf" x2="0" y2="1"><stop offset=".15" stop-color="#1b0a0e"/><stop offset=".6" stop-color="#1b0a0e" stop-opacity=".78"/><stop offset="1" stop-color="#1b0a0e" stop-opacity="0"/></linearGradient>
    <radialGradient id="mg"><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="mm" maskUnits="userSpaceOnUse"><circle cx="560" cy="300" r="250" fill="url(#mg)"/></mask>
    <radialGradient id="mist"><stop offset="0" stop-color="#1a090d" stop-opacity=".66"/><stop offset="1" stop-color="#1a090d" stop-opacity="0"/></radialGradient>
    <path id="cb" d="M-16.5-.6C-14.6-1.6-13.4-2.6-12-3.4C-10.6-4.6-8-4.8-6.4-3.6C-2-3.8 4-3 8.4-1.6L15.6-3.6C17.2-1.4 17.2 1.6 15.6 3.6L8.4 1.8C3.6 4.4-4 4.6-8 2.6C-10 1.8-11.6 1-12.6.6C-13.8.2-15.2-.1-16.5-.6Z"/>
    <path id="cw" d="M0 0C0-8 1-16 4-24L5.5-28.5 6.6-25 8.6-29.5 9.4-25.4 11.6-29.4 12-25 14.2-28 14.2-23.6 16-25.4C15.2-18 13.6-8 14-.8Z"/>
  </defs>

  <!-- 月 -->
  <circle class="hl" cx="570" cy="262" r="430" fill="url(#halo)"/>
  <circle cx="560" cy="330" r="190" fill="url(#disc)"/>
  <ellipse cx="500" cy="226" rx="66" ry="40" fill="url(#mare)"/>
  <ellipse cx="616" cy="192" rx="48" ry="30" fill="url(#mare)"/>
  <ellipse cx="660" cy="270" rx="40" ry="32" fill="url(#mare)"/>
  <circle cx="560" cy="330" r="188.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle class="md" cx="560" cy="330" r="190" fill="#14060a"/>
  <!-- 云随风（风向标指右）往左飘过月亮，月光随之暗下 -->
  <g class="cf" fill="url(#cf)">
    <g class="c1"><ellipse cx="575" cy="226" rx="330" ry="66" fill="url(#mist)"/><path d="M280 240c11-2 42-9 63-11s43 0 64-2s42-6 63-9s42-9 63-9s43 3 64 6s42 9 63 11s42 1 63 1s43 1 64 4s52 7 63 9c-11 0-42 2-63 3s-43 0-64 0s-42 1-63 2s-42 5-63 6s-43 3-64 3s-42-1-63-3s-42-4-63-6s-43-2-64-3s-52-2-63-2z"/><path d="M590 276c8-1 31-2 46-3s31-5 46-5s31-1 46 0s31 3 46 5s38 2 46 3c-8 0-31 2-46 2s-31 0-46 0s-31 3-46 3s-31-1-46-2s-38-3-46-3z"/></g>
    <path class="c2" d="M450 186c9-1 34-4 52-5s34 0 51-1s35-4 52-5s34-1 52 0s34 4 51 6s43 4 52 5c-9 1-34 3-52 3s-34 1-51 1s-35-2-52-2s-34 2-52 2s-34 0-51 0s-43-3-52-4z"/>
  </g>
  <!-- 云边只在月前被照亮 -->
  <g class="cf" mask="url(#mm)" fill="#ea7050" fill-opacity=".8">
    <g class="c1"><path d="M280 240c11-2 42-9 63-11s43 0 64-2s42-6 63-9s42-9 63-9s43 3 64 6s42 9 63 11s42 1 63 1s43 1 64 4s52 7 63 9c-11-1-42-6-63-8s-43-2-64-3s-42 1-63-1s-42-7-63-10s-43-8-64-7s-42 7-63 10s-42 7-63 8s-43-1-64 1s-52 9-63 10z"/><path d="M590 276c8-1 31-2 46-3s31-5 46-5s31-1 46 0s31 3 46 5s38 2 46 3c-8 0-31-1-46-2s-31-3-46-4s-31-1-46-1s-31 4-46 5s-38 2-46 2z"/></g>
    <path class="c2" d="M450 186c9-1 34-4 52-5s34 0 51-1s35-4 52-5s34-1 52 0s34 4 51 6s43 4 52 5c-9 0-34-2-52-3s-34-6-51-6s-35 0-52 0s-34 4-52 5s-34-1-51 0s-43 4-52 4z"/>
  </g>

  <!-- 钟楼 -->
  <g fill="url(#stone)">
    <!-- 尖顶 + 风向标 -->
    <rect x="598.6" y="22" width="2.8" height="50"/>
    <circle cx="600" cy="40" r="5"/>
    <path d="M581 55h34l-6-5h4l7 6-7 6h-4l6-5h-34l-4 4h-4l5-5-5-5h4z"/>
    <path d="M600 68c4 54 15 98 44 128h-88c29-30 40-74 44-128z"/>
    <path d="M594 156h12l-6-12z" fill="#170c0f"/>
    <path d="M542 196l6-40 6 40zM646 196l6-40 6 40z"/>
    <!-- 钟层：表盘镂空，月光从里面透出来 -->
    <rect x="536" y="196" width="128" height="11" rx="1"/>
    <path fill-rule="evenodd" d="M548 207h104v91h-104zM600 218a34 34 0 1 0 0.01 0z"/>
    <rect x="538" y="298" width="124" height="10" rx="1"/>
    <!-- 钟楼层：两扇尖拱窗 -->
    <path fill-rule="evenodd" d="M552 308h96v76h-96zM568 374v-36c0-9 5-15 11-18 6 3 11 9 11 18v36zM610 374v-36c0-9 5-15 11-18 6 3 11 9 11 18v36z"/>
    <rect x="544" y="384" width="112" height="9" rx="1"/>
    <!-- 塔身：越往下越宽，仰视的透视 -->
    <path d="M556 393h88l26 2007h-140z"/>
  </g>
  <!-- 表盘：指针停在十一点五十，午夜前 -->
  <g stroke="#0a0608" stroke-linecap="round" fill="none">
    <circle cx="600" cy="252" r="31.5" stroke-width="5"/>
    <circle cx="600" cy="252" r="21" stroke-width="1.6"/>
    <path stroke-width="4" d="M600 223v6M629 252h-6M600 281v-6M571 252h6"/>
    <path stroke-width="2.4" d="M614.5 226.9l-2.5 4.3M625.1 237.5l-4.3 2.5M625.1 266.5l-4.3-2.5M614.5 277.1l-2.5-4.3M585.5 277.1l2.5-4.3M574.9 266.5l4.3-2.5M574.9 237.5l4.3 2.5M585.5 226.9l2.5 4.3"/>
    <path stroke-width="3.6" d="M600 252l-1.3-15"/>
    <path stroke-width="2.4" d="M600 252l-19.5-11.3"/>
  </g>
  <circle cx="600" cy="252" r="3.2" fill="#0a0608"/>
  <!-- 守在钟层檐口上的一只乌鸦 -->
  <path fill="#0a0608" d="M641 298l7-5c1-6 6-10 11-11 2-4 6-5 9-3l6 2-6 1c0 4-2 8-5 11l-1 5h-2v-4h-5l-1 4h-2v-3l-11 3z"/>
  <!-- 吊着的说书人，手垂魔典；绳结为轴 -->
  <path d="M548.5 210.6H519M548.5 229 532 210.8" fill="none" stroke="#0a0608" stroke-width="2.4"/>
  <g fill="#0a0608"><g transform="translate(523 212.6)"><g class="s1"><g class="s2"><path d="M-.7 0h1.4v16h-1.4z"/><g class="tw"><circle cx="3.4" cy="18.4" r="3.8"/><path d="M-4.6 23.6C-2 21.6 1 20.8 5.4 22.4L5.8 38 6.6 49.6 1 50.4-6 49.8-5.3 38ZM-3.4 49.6-3 62-1.6 65.2-.6 49.8ZM.8 49.8 1.4 63 3 65.4 3.4 49.8Z"/><path d="M-4.3 24.6-5.6 33.4-6 40.6M5 23.4 6.3 32.6 6.8 39.8" fill="none" stroke="#0a0608" stroke-width="2.3" stroke-linecap="round"/><path d="M-6.8 39.8-11.5 41-9.9 49.4-5 48.2Z"/><path fill="#8a6a40" d="M-11.6 41.9l.8-.1 1.4 6.8-.8.1z"/></g></g></g></g></g>
  <!-- 塔身上的灯窗和腰线 -->
  <g fill="#170d10">
    <rect x="551" y="660" width="98" height="5"/>
    <rect x="547" y="960" width="106" height="6"/>
    <rect x="543" y="1280" width="114" height="6"/>
  </g>
  <path fill="#060304" d="M592 520v-26c0-6 4-10 8-12 4 2 8 6 8 12v26zM590 790v-28c0-7 5-11 10-13 5 2 10 6 10 13v28z"/>
  <path fill="url(#lit)" opacity=".85" d="M572 612v-18c0-4 3-7 6-8 3 1 6 4 6 8v18zM614 1140v-22c0-5 3-8 7-9 4 1 7 4 7 9v22z"/>
  <!-- 乌鸦：一只顺风往左，一对逆风往右；只在飞时扇翅 -->
  <g fill="#0a0608">
    <g class="ka"><g transform="translate(0 168)"><g class="ky"><g transform="translate(-3.2 -3.4) scale(.86)"><use xlink:href="#cw" class="wa"/></g><use xlink:href="#cb"/><g transform="translate(-5 -2.6)"><use xlink:href="#cw" class="wa"/></g></g></g></g>
    <g class="kb"><g transform="translate(0 184) scale(-1 1)"><g transform="translate(-3.2 -3.4) scale(.86)"><use xlink:href="#cw" class="wb"/></g><use xlink:href="#cb"/><g transform="translate(-5 -2.6)"><use xlink:href="#cw" class="wb"/></g><g class="q" transform="translate(52 -24) scale(.86)"><g transform="translate(-3.2 -3.4) scale(.86)"><use xlink:href="#cw" class="wb"/></g><use xlink:href="#cb"/><g transform="translate(-5 -2.6)"><use xlink:href="#cw" class="wb"/></g></g></g></g>
  </g>
</svg>
